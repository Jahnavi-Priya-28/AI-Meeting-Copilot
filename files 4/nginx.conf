# nginx.conf — serves the React SPA and proxies /api + /health to the backend

server {
    listen       80;
    server_name  _;

    # ── Static assets (hashed filenames → long cache) ──────────────────────
    location /assets/ {
        root  /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── API proxy → FastAPI backend ────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Allow large audio uploads (100 MB)
        client_max_body_size 105m;
        # Long timeout for Whisper transcription
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
    }

    # ── Health check proxy ─────────────────────────────────────────────────
    location /health {
        proxy_pass http://backend:8000/health;
    }

    # ── SPA fallback — all other routes serve index.html ──────────────────
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ───────────────────────────────────────────────────
    gzip            on;
    gzip_types      text/plain text/css application/json
                    application/javascript text/xml application/xml
                    application/xml+rss text/javascript;
    gzip_min_length 1024;
}
